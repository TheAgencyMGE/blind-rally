<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blind Rally</title>
  <meta name="description" content="Know the route. Not the destination. A free, open-source real-world navigation game.">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://upload.wikimedia.org https://commons.wikimedia.org; connect-src 'self' https://tiles.openfreemap.org https://overpass-api.de https://routing.openstreetmap.de https://router.project-osrm.org https://www.wikidata.org https://*.wikipedia.org; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; child-src blob:; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blind Rally">
  <meta property="og:title" content="Blind Rally">
  <meta property="og:description" content="Know the route. Not the destination.">
  <meta property="og:image" content="https://theagencymge.github.io/blind-rally/icons/og.png">
  <meta property="og:url" content="https://theagencymge.github.io/blind-rally/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preload" href="./fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="./css/app.css">
  <script src="./vendor/maplibre/maplibre-gl-csp.js" defer></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body data-screen="home">
  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></g></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5 20V12M12 20V5M19 20v-5"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-walk" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M9 21l3-6 3 3v3M12 15l-1-5 4 2 3 1M11 10l-4 2-1 4"/></g></symbol>
      <symbol id="i-car" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3v-5l2-5h14l2 5v5h-2M5 12h14"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/></g></symbol>
      <symbol id="i-locate" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></g></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v13M7 8l5-5 5 5M5 13v7h14v-7"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 11l9-7 9 7M5 10v10h14V10"/></symbol>
      <symbol id="i-again" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 21V4h12l-2 4 2 4H5"/></symbol>
      <symbol id="m-straight" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 21V4M6 10l6-6 6 6"/></symbol>
      <symbol id="m-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M7 21v-8a3 3 0 0 1 3-3h10M15 5l5 5-5 5"/></symbol>
      <symbol id="m-slight-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M9 21v-7l8-8M11 5h7v7"/></symbol>
      <symbol id="m-sharp-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M8 3v13l9 4M18 13v7h-7"/></symbol>
      <symbol id="m-uturn" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M16 21V9a5 5 0 0 0-10 0v4M3 10l3 4 3-4"/></symbol>
      <symbol id="m-roundabout" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="11" r="4"/><path d="M12 21v-6M15 8l4-4M15 4h4v4"/></g></symbol>
      <symbol id="m-depart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="17" r="3"/><path d="M12 14V4M8 8l4-4 4 4" stroke-linejoin="round"/></g></symbol>
      <symbol id="m-arrive" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M5 21V4h12l-2 4 2 4H5"/></symbol>
    </defs>
  </svg>

  <main class="app" id="app">
    <!-- HOME -->
    <section class="screen screen--home" data-screen="home" aria-labelledby="home-title">
      <header class="bar">
        <span></span>
        <div class="bar__end">
          <button class="icon-btn" data-action="stats" aria-label="Stats"><svg><use href="#i-chart"/></svg></button>
          <button class="icon-btn" data-action="settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
        </div>
      </header>

      <div class="home__center">
        <h1 class="logo" id="home-title">Blind<br><span>Rally</span></h1>
        <p class="tagline">Know the route. Not the destination.</p>
      </div>

      <div class="resume" id="resume-banner" hidden>
        <button class="btn btn--primary" data-action="resume-active">Resume</button>
        <button class="icon-btn" data-action="discard-active" aria-label="Abandon unfinished rally"><svg><use href="#i-x"/></svg></button>
      </div>

      <dl class="pair">
        <div><dt>Best</dt><dd class="num" id="home-best">—</dd></div>
        <div><dt>Rallies</dt><dd class="num" id="home-count">0</dd></div>
      </dl>

      <div class="dock">
        <button class="btn btn--primary btn--xl" data-action="start">Start</button>
        <a class="fine" href="./privacy.html">Privacy</a>
      </div>
    </section>

    <!-- SETUP -->
    <section class="screen screen--setup" data-screen="setup" aria-label="New rally">
      <header class="bar">
        <button class="icon-btn" data-action="back" aria-label="Back"><svg><use href="#i-back"/></svg></button>
      </header>

      <div class="stack">
        <p class="alert" id="setup-error" role="alert" hidden></p>

        <div class="seg seg--icons" role="radiogroup" aria-label="Travel mode">
          <label><input type="radio" name="mode" value="walk" aria-label="Walking"><span><svg><use href="#i-walk"/></svg></span></label>
          <label><input type="radio" name="mode" value="drive" aria-label="Driving"><span><svg><use href="#i-car"/></svg></span></label>
        </div>

        <label class="check" id="drive-safety" hidden><input type="checkbox" id="drive-ack"><span>A passenger holds the phone. The driver never touches it.</span></label>

        <div class="seg" role="radiogroup" aria-label="Briefing time">
          <label><input type="radio" name="difficulty" value="rookie" aria-label="Rookie, 60 seconds"><span class="num">60<small>s</small></span></label>
          <label><input type="radio" name="difficulty" value="pro" aria-label="Pro, 30 seconds"><span class="num">30<small>s</small></span></label>
          <label><input type="radio" name="difficulty" value="insane" aria-label="Insane, 15 seconds"><span class="num">15<small>s</small></span></label>
        </div>

        <div class="seg" id="radius-chips" role="radiogroup" aria-label="Maximum distance"></div>

        <div class="seg seg--icons">
          <button type="button" data-action="use-location" id="opt-gps" aria-label="Use my current location" aria-pressed="false"><svg><use href="#i-locate"/></svg><span class="seg__note num" id="gps-acc"></span></button>
        </div>
      </div>

      <div class="dock">
        <button class="btn btn--primary btn--xl" data-action="scout" id="scout-btn" disabled>Go</button>
      </div>
    </section>

    <!-- SCOUTING -->
    <section class="screen screen--scouting" data-screen="scouting" aria-label="Finding a destination" aria-busy="true">
      <div class="radar" aria-hidden="true"><i></i></div>
      <button class="icon-btn" data-action="cancel-scout" aria-label="Cancel"><svg><use href="#i-x"/></svg></button>
    </section>

    <!-- BRIEFING (+ countdown) -->
    <section class="screen screen--briefing" data-screen="briefing" aria-label="Briefing">
      <div class="brief__map" id="brief-map" aria-label="Route map"></div>
      <div class="brief__hud">
        <div class="ring" id="brief-ring" role="timer">
          <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring__track" cx="50" cy="50" r="44"/><circle class="ring__fill" id="ring-fill" cx="50" cy="50" r="44"/></svg>
          <span class="ring__num num" id="brief-count">30</span>
        </div>
        <p class="brief__meta num"><span id="brief-dist">—</span><span id="brief-eta">—</span></p>
      </div>
      <div class="brief__sheet">
        <ol class="dirs" id="brief-dirs" aria-label="Directions"></ol>
        <button class="btn btn--primary btn--xl" data-action="begin-now">Go</button>
      </div>
      <div class="countdown" id="countdown" aria-live="assertive"><span class="num" id="countdown-num">3</span></div>
    </section>

    <!-- RALLY -->
    <section class="screen screen--rally" data-screen="rally" aria-label="Rally in progress">
      <div class="rally__map" id="rally-map" aria-hidden="true"></div>
      <header class="bar">
        <button class="icon-btn" data-action="abandon" aria-label="Abandon rally"><svg><use href="#i-x"/></svg></button>
        <span class="gps" id="gps-status" role="status" aria-label="GPS"><i></i><span class="num"></span></span>
      </header>
      <p class="rally__time num" id="rally-time" role="timer">00:00.0</p>
      <p class="fine fine--warn" id="rally-drive-note" hidden>Driver: eyes on the road</p>
      <div class="dev" id="dev-panel" hidden>
        <button class="btn btn--small" data-action="dev-step">Step</button>
        <button class="btn btn--small" data-action="dev-arrive">Arrive</button>
        <button class="btn btn--small" data-action="dev-weak">Weak GPS</button>
      </div>
      <div class="dock">
        <button class="here" data-action="check-in" id="checkin-btn" aria-label="I'm here, check in"><svg><use href="#i-flag"/></svg></button>
        <button class="fine fine--link" data-action="manual-verify" id="manual-btn" hidden>GPS failing? Confirm manually</button>
      </div>
    </section>

    <!-- DISCOVERED -->
    <section class="screen screen--discovered" data-screen="discovered" aria-labelledby="disc-name">
      <div class="disc__map" id="disc-map" aria-label="Destination map"></div>
      <div class="disc">
        <img class="disc__photo" id="disc-img" alt="" decoding="async" hidden>
        <p class="kicker" id="disc-kind"></p>
        <h2 class="disc__name" id="disc-name"></h2>
        <p class="disc__time num" id="disc-time">00:00.0</p>
        <p class="disc__pb num" id="disc-pb"></p>
        <p class="fine" id="disc-meta"></p>
        <p class="fine" id="disc-credit" hidden></p>
      </div>
      <div class="dock dock--row">
        <button class="icon-btn icon-btn--ring" data-action="home" aria-label="Home"><svg><use href="#i-home"/></svg></button>
        <button class="btn btn--primary btn--xl" data-action="again" aria-label="Rally again"><svg><use href="#i-again"/></svg></button>
        <button class="icon-btn icon-btn--ring" data-action="share" aria-label="Share result"><svg><use href="#i-share"/></svg></button>
      </div>
    </section>

    <!-- STATS -->
    <section class="screen screen--stats" data-screen="stats" aria-label="Stats">
      <header class="bar">
        <button class="icon-btn" data-action="back" aria-label="Back"><svg><use href="#i-back"/></svg></button>
      </header>
      <div class="stack">
        <dl class="pair pair--3">
          <div><dt>Done</dt><dd class="num" id="st-completed">0</dd></div>
          <div><dt>Places</dt><dd class="num" id="st-discovered">0</dd></div>
          <div><dt>Quit</dt><dd class="num" id="st-abandoned">0</dd></div>
        </dl>
        <table class="best">
          <thead><tr><th scope="col"><span class="sr-only">Briefing</span></th><th scope="col" aria-label="Walking"><svg><use href="#i-walk"/></svg></th><th scope="col" aria-label="Driving"><svg><use href="#i-car"/></svg></th></tr></thead>
          <tbody id="st-best"></tbody>
        </table>
        <ol class="history" id="st-history"></ol>
      </div>
    </section>

    <!-- SETTINGS -->
    <section class="screen screen--settings" data-screen="settings" aria-label="Settings">
      <header class="bar">
        <button class="icon-btn" data-action="back" aria-label="Back"><svg><use href="#i-back"/></svg></button>
      </header>
      <div class="stack">
        <div class="seg" role="radiogroup" aria-label="Units">
          <label><input type="radio" name="units" value="metric"><span>km</span></label>
          <label><input type="radio" name="units" value="imperial"><span>mi</span></label>
        </div>
        <label class="switch"><span>Vibration</span><input type="checkbox" id="set-haptics"><i aria-hidden="true"></i></label>
        <label class="switch"><span>Keep screen on</span><input type="checkbox" id="set-awake"><i aria-hidden="true"></i></label>
        <button class="btn btn--danger" data-action="clear-data">Erase data</button>
        <p class="fine">
          <a href="./privacy.html">Privacy</a> ·
          Map © <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a>,
          <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> ·
          Routing <a href="https://project-osrm.org" target="_blank" rel="noopener">OSRM</a> ·
          MIT <span id="app-version"></span>
        </p>
      </div>
    </section>
  </main>

  <dialog class="dialog" id="dialog">
    <form method="dialog">
      <p class="dialog__title" id="dialog-title"></p>
      <p class="dialog__body" id="dialog-body"></p>
      <div class="dialog__actions">
        <button class="btn" value="cancel" id="dialog-cancel">Cancel</button>
        <button class="btn btn--primary" value="ok" id="dialog-ok">OK</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Blind Rally needs JavaScript.</p></noscript>
</body>
</html>
